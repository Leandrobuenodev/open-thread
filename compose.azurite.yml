name: openthread-storage
services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --skipApiVersionCheck --silent
    ports:
      - '127.0.0.1:10000:10000'
      - '127.0.0.1:10002:10002'
    volumes:
      - azurite-data:/data
volumes:
  azurite-data:
